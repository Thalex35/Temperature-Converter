<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css" type="text/css" />
    <title>Temperature Converter</title>
    <script src="script.js" defer></script>
    
</head>
<body>

    <!-- Main card container holds all converter elements -->
    <!-- No form method or action since this is a purely client-side app -->
    <!-- event.preventDefault() in JavaScript handles the button click instead -->
    <div class="card">
        <h1>Temperature Converter</h1>

        <!-- Number input: user enters the temperature value to convert -->
        <div class="input-group">
            <label for="temperature-input">Enter the temperature</label>
            <input id="temperature-input" type="number" placeholder="e.g. 36" />
        </div>

        <!-- Dropdown: user selects which direction to convert -->
        <!-- The value attribute on each option is used by JavaScript to identify the selection -->
        <div class="select-group">
            <select id="conversion-direction" name="conversion">
                <option value="celsius-to-fahrenheit">Celsius to Fahrenheit</option>
                <option value="fahrenheit-to-celsius">Fahrenheit to Celsius</option>
            </select>
        </div>

        <!-- Convert button: type="button" prevents any default browser form behavior -->
        <!-- The click event listener in JavaScript handles the conversion logic -->
        <button type="button" class="convert-button" id="convert-button">Convert</button>

        <!-- Output area: both paragraphs are hidden by default -->
        <!-- JavaScript removes the hidden class to reveal the appropriate one -->
        <div class="output-area">
            <p class="result-display hidden" id="result-display"></p>
            <p class="error-message hidden" id="error-message"></p>
        </div>
    </div>

    
</body>
</html>
